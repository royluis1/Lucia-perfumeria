version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lucia_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-lucia_perfumeria}
    ports:
      # Solo accesible desde la máquina local; no exponer estos puertos a la red
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lucia_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: lucia_mailhog
    ports:
      - "127.0.0.1:1025:1025" # Puerto SMTP para que el backend envíe mails
      - "127.0.0.1:8025:8025" # Interfaz Web para ver los mails (http://localhost:8025)
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: